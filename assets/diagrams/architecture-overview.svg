<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Architecture overview</title>
  <desc id="desc">Document input flows through ingestion, chunking, embeddings, vector store, retrieval, answer and validation agents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 8; }
      .agent { fill: #eff6ff; stroke: #1f6feb; stroke-width: 2; rx: 8; }
      .store { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .hint { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .line { stroke: #1f6feb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .bg { fill: #f9fafb; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="460"/>
  <text x="42" y="48" class="title">AI RAG Agent Lab</text>
  <text x="42" y="74" class="subtitle">Sanitized FastAPI demo for retrieval, vector-like search and agentic workflows</text>

  <rect class="box" x="40" y="155" width="135" height="78"/>
  <text class="label" x="62" y="188">Document</text>
  <text class="hint" x="62" y="210">input text</text>

  <rect class="agent" x="215" y="155" width="145" height="78"/>
  <text class="label" x="245" y="188">Ingestion</text>
  <text class="hint" x="245" y="210">agent</text>

  <rect class="box" x="400" y="155" width="130" height="78"/>
  <text class="label" x="431" y="188">Chunking</text>
  <text class="hint" x="431" y="210">overlap</text>

  <rect class="box" x="570" y="155" width="150" height="78"/>
  <text class="label" x="600" y="188">Embeddings</text>
  <text class="hint" x="600" y="210">deterministic</text>

  <rect class="store" x="760" y="155" width="145" height="78"/>
  <text class="label" x="797" y="188">Vector</text>
  <text class="hint" x="797" y="210">store + SQL</text>

  <rect class="agent" x="215" y="310" width="145" height="78"/>
  <text class="label" x="247" y="343">Retrieval</text>
  <text class="hint" x="247" y="365">hybrid search</text>

  <rect class="agent" x="400" y="310" width="130" height="78"/>
  <text class="label" x="438" y="343">Answer</text>
  <text class="hint" x="438" y="365">grounded</text>

  <rect class="agent" x="570" y="310" width="150" height="78"/>
  <text class="label" x="606" y="343">Validation</text>
  <text class="hint" x="606" y="365">warnings</text>

  <rect class="box" x="760" y="310" width="145" height="78"/>
  <text class="label" x="797" y="343">JSON</text>
  <text class="hint" x="797" y="365">response</text>

  <path class="line" d="M175 194 L215 194"/>
  <path class="line" d="M360 194 L400 194"/>
  <path class="line" d="M530 194 L570 194"/>
  <path class="line" d="M720 194 L760 194"/>
  <path class="line" d="M832 233 C832 275 287 270 287 310"/>
  <path class="line" d="M360 349 L400 349"/>
  <path class="line" d="M530 349 L570 349"/>
  <path class="line" d="M720 349 L760 349"/>
</svg>
