<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent organization</title>
  <desc id="desc">Four agents are coordinated by a FastAPI service layer.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .core { fill: #111827; stroke: #111827; rx: 12; }
      .node { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 10; }
      .label { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
      .coreText { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #4b5563; }
      .line { stroke: #374151; stroke-width: 2.5; }
    </style>
  </defs>
  <rect class="bg" width="1000" height="420"/>
  <rect class="core" x="390" y="40" width="220" height="76"/>
  <text class="coreText" x="438" y="74">FastAPI</text>
  <text class="coreText" x="425" y="98">Orchestrator</text>
  <line class="line" x1="500" y1="116" x2="500" y2="165"/>
  <line class="line" x1="165" y1="165" x2="835" y2="165"/>
  <line class="line" x1="165" y1="165" x2="165" y2="205"/>
  <line class="line" x1="390" y1="165" x2="390" y2="205"/>
  <line class="line" x1="610" y1="165" x2="610" y2="205"/>
  <line class="line" x1="835" y1="165" x2="835" y2="205"/>
  <rect class="node" x="65" y="205" width="200" height="110"/>
  <text class="label" x="105" y="244">Ingestion</text>
  <text class="small" x="94" y="270">load, chunk, embed</text>
  <rect class="node" x="290" y="205" width="200" height="110"/>
  <text class="label" x="328" y="244">Retrieval</text>
  <text class="small" x="322" y="270">rank and return context</text>
  <rect class="node" x="510" y="205" width="200" height="110"/>
  <text class="label" x="568" y="244">Answer</text>
  <text class="small" x="546" y="270">draft grounded response</text>
  <rect class="node" x="735" y="205" width="200" height="110"/>
  <text class="label" x="784" y="244">Validation</text>
  <text class="small" x="769" y="270">confidence and warnings</text>
</svg>

